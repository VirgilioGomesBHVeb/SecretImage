<!DOCTYPE html>
<html lang="pt-MZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061b2d">
  <meta name="description" content="SecretImage 2.0 - criptografia e esteganografia LSB">
  <title>{% block title %}SecretImage 2.0{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('index') }}" aria-label="SecretImage 2.0 - Início">
        <span class="brand-icon"><span class="shield-shape"></span><span class="tiny-lock"></span></span>
        <span>SecretImage <strong>2.0</strong></span>
      </a>
      <nav class="main-nav">
        <a class="{% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">Início</a>
        <a class="{% if request.endpoint == 'about_page' %}active{% endif %}" href="{{ url_for('about_page') }}">Sobre</a>
        <a class="{% if request.endpoint == 'help_page' %}active{% endif %}" href="{{ url_for('help_page') }}">Ajuda</a>
      </nav>
    </div>
  </header>

  <main class="page-shell">{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <span>SecretImage 2.0</span><span class="dot">|</span><span>Segurança Informática</span><span class="dot">|</span><span>UPM</span>
    <span class="online"><i></i> Online</span>
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
